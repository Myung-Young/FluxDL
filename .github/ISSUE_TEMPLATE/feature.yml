name: Feature request
description: An idea that fits the roadmap
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change (UI, settings, engine?)
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: No new dependency (or justified in the proposal)
        - label: No DRM circumvention, no telemetry
        - label: Works offline-first where possible
