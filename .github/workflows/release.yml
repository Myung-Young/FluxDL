name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch binaries (yt-dlp & ffmpeg)
        run: pnpm fetch:binaries

      - name: Package Windows binaries
        run: pnpm dist

      - name: SBOM (CycloneDX, committed tool, pnpm workspace)
        run: pnpm bom

      - name: Attest build provenance (sigstore, GitHub-hosted)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/FluxDL-Setup-*.exe, release/FluxDL-Portable-*.exe"

      - name: Publish Release & Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs
