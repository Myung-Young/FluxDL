<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{color-scheme:dark}
body{width:300px;margin:0;padding:12px;background:#0b0d12;color:#e8eaf0;font:14px/1.4 system-ui,sans-serif}
h1{font-size:15px;margin:0 0 8px}
label{font-size:12px;color:#9aa0b4;display:block;margin:8px 0 2px}
input{width:100%;box-sizing:border-box;border-radius:7px;border:1px solid #262c3d;background:#141824;color:#e8eaf0;padding:7px 9px;font:inherit}
.row{display:flex;gap:6px;margin-top:10px}
button{flex:1;border-radius:7px;border:none;background:#6ea8fe;color:#06121f;font-weight:600;padding:8px;cursor:pointer;font:inherit}
button.ghost{background:#141824;color:#e8eaf0;border:1px solid #262c3d;font-weight:400}
#status{font-size:12px;color:#9aa0b4;margin-top:8px;min-height:17px}
.note{font-size:11px;color:#9aa0b4;margin-top:8px}
</style>
</head>
<body>
<h1>FluxDL Remote</h1>
<label for="base">Server</label>
<input id="base" autocomplete="off" spellcheck="false">
<label for="tok">Token (from the app's pairing link)</label>
<input id="tok" type="password" autocomplete="off" spellcheck="false">
<div class="row">
<button id="save">Save</button>
<button id="test" class="ghost">Test</button>
</div>
<div class="row">
<button id="send">Send current tab</button>
</div>
<div id="status" role="status"></div>
<div class="note">Loopback only. The token stays in this browser (local storage).</div>
<script src="popup.js"></script>
</body>
</html>
