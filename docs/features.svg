<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="FluxDL feature overview">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121214"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="faccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#fbg)"/>
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#2a2a2f" stroke-width="2"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="60" y="64" font-size="30" font-weight="700" fill="#f4f4f5">Everything after the progress bar</text>
    <text x="60" y="94" font-size="17" fill="#a1a1aa">Four engines, one queue, one library — all local, no accounts.</text>
    <g>
      <rect x="60" y="120" width="255" height="220" rx="16" fill="#141416" stroke="#2a2a2f" stroke-width="2"/>
      <circle cx="92" cy="164" r="16" fill="none" stroke="url(#faccent)" stroke-width="5"/>
      <path d="M92 152 L92 168 M92 168 L84 160 M92 168 L100 160" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="120" y="158" font-size="20" font-weight="700" fill="#f4f4f5">Engines</text>
      <text x="120" y="182" font-size="15" fill="#a1a1aa">yt-dlp · gallery-dl</text>
      <text x="84" y="218" font-size="15" fill="#d4d4d8">Streamlink · N_m3u8DL-RE</text>
      <text x="84" y="244" font-size="15" fill="#d4d4d8">whisper · rclone packs</text>
      <text x="84" y="270" font-size="15" fill="#d4d4d8">Auto router + badges</text>
      <text x="84" y="306" font-size="15" font-weight="700" fill="#a5b4fc">Pinned + SHA-256 checked</text>
    </g>
    <g>
      <rect x="335" y="120" width="255" height="220" rx="16" fill="#141416" stroke="#2a2a2f" stroke-width="2"/>
      <rect x="359" y="148" width="52" height="10" rx="5" fill="url(#faccent)"/>
      <rect x="359" y="166" width="120" height="10" rx="5" fill="#3f3f46"/>
      <rect x="359" y="184" width="88" height="10" rx="5" fill="#3f3f46"/>
      <rect x="359" y="202" width="140" height="10" rx="5" fill="#3f3f46"/>
      <text x="359" y="248" font-size="20" font-weight="700" fill="#f4f4f5">Queue &amp; Library</text>
      <text x="359" y="272" font-size="15" fill="#d4d4d8">Priorities · subscriptions</text>
      <text x="359" y="306" font-size="15" font-weight="700" fill="#a5b4fc">Health checks + stats</text>
    </g>
    <g>
      <rect x="610" y="120" width="255" height="220" rx="16" fill="#141416" stroke="#2a2a2f" stroke-width="2"/>
      <circle cx="646" cy="262" r="26" fill="none" stroke="url(#faccent)" stroke-width="6"/>
      <path d="M638 262 L645 269 L656 256" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="634" y="196" font-size="20" font-weight="700" fill="#f4f4f5">Pipeline</text>
      <text x="634" y="220" font-size="15" fill="#d4d4d8">Convert · tag · compress</text>
    </g>
    <g>
      <rect x="885" y="120" width="255" height="220" rx="16" fill="#141416" stroke="#2a2a2f" stroke-width="2"/>
      <rect x="909" y="148" width="120" height="76" rx="10" fill="none" stroke="url(#faccent)" stroke-width="5"/>
      <circle cx="1052" cy="186" r="10" fill="#a5b4fc"/>
      <text x="909" y="262" font-size="20" font-weight="700" fill="#f4f4f5">Remote</text>
      <text x="909" y="286" font-size="15" fill="#d4d4d8">PWA · extension · CLI</text>
      <text x="909" y="310" font-size="15" font-weight="700" fill="#a5b4fc">Token auth, LAN opt-in</text>
    </g>
